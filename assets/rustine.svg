<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Rustine">
<style>
/* Rustine en mouvement : traits de vitesse, coutures qui tournent, éclair qui
   claque. Seuls transform et opacity sont animés (composités par le GPU). */
.v{stroke:#1d1a15;stroke-width:9;stroke-linecap:round;animation:file .55s linear infinite}
.v2{animation-delay:-.18s}.v3{animation-delay:-.36s}
@keyframes file{0%{transform:translateX(26px);opacity:0}25%{opacity:1}100%{transform:translateX(-30px);opacity:0}}
.roue{transform-origin:118px 100px;animation:tourne 1.1s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.corps{animation:fonce 1.6s ease-in-out infinite;transform-origin:118px 100px}
@keyframes fonce{0%,100%{transform:translateX(0)}45%{transform:translateX(3px) skewX(-4deg)}55%{transform:translateX(-1px)}}
.eclair{transform-origin:118px 100px;animation:claque 1.6s cubic-bezier(.2,.9,.3,1.4) infinite}
@keyframes claque{0%,58%,100%{transform:scale(1)}64%{transform:scale(1.22) rotate(-6deg)}72%{transform:scale(.96)}}
.halo{transform-origin:118px 100px;animation:halo 1.6s ease-out infinite;opacity:0}
@keyframes halo{0%,58%{transform:scale(.6);opacity:0}64%{opacity:.9}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.v,.roue,.corps,.eclair,.halo{animation:none}.v{opacity:0}}
</style>
<g class="v"><line x1="22" y1="66" x2="52" y2="66"/></g>
<g class="v v2"><line x1="10" y1="100" x2="50" y2="100"/></g>
<g class="v v3"><line x1="24" y1="134" x2="50" y2="134"/></g>
<g class="corps">
  <circle cx="125" cy="107" r="68" fill="#1d1a15"/>
  <circle cx="118" cy="100" r="68" fill="#f6c643" stroke="#1d1a15" stroke-width="9"/>
  <circle class="halo" cx="118" cy="100" r="52" fill="none" stroke="#fffdf6" stroke-width="10"/>
  <circle class="roue" cx="118" cy="100" r="53" fill="none" stroke="#1d1a15" stroke-width="6" stroke-linecap="round" stroke-dasharray="11 14"/>
  <path class="eclair" d="M128 52 L94 108 L116 108 L106 150 L144 90 L121 90 Z" fill="#1d1a15" stroke="#1d1a15" stroke-width="4" stroke-linejoin="round"/>
</g>
</svg>
